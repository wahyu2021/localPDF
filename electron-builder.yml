appId: com.localpdf.app
productName: LocalPDF
copyright: Copyright © 2026

directories:
  buildResources: resources
  output: build

# Arahkan ke hasil compile TypeScript di dist/
files:
  - dist/**/*
  - public/**/*
  - "!src"
  - "!binaries"
  - "!temp"
  - "!build"

# Binary engine di-copy ke luar asar supaya bisa dieksekusi langsung
extraResources:
  - from: binaries/${os}/
    to: binaries/
    filter:
      - "**/*"

win:
  target: nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LocalPDF
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerSidebar: sidebar.bmp
  uninstallerSidebar: sidebar.bmp
  installerHeader: header.bmp
  license: license.txt

